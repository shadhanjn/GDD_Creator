/* ── images ─────────────────────────────────────────────────────────── */
async function addImages(fid, files) {
  const f = FIELD[fid];
  if (!f || f.k !== 'images' || GAL_BUSY.has(fid)) return;
  const picks = files.filter(isImgFile);
  if (!picks.length) { toast(T('imgFail')); return; }
  const list = (S.d[fid] = S.d[fid] || []);
  const max = f.max || IMG_PER_FIELD;
  const room = max - list.length;
  if (room <= 0 || picks.length > room) toast(T('imgMax', max));
  if (room <= 0) return;
  GAL_BUSY.add(fid);
  refreshField(fid);
  let added = 0;
  let failed = false;
  for (const file of picks.slice(0, room)) {
    try {
      const rec = await shrinkImage(file);
      const id = newImgId();
      await storeImage(id, rec);
      list.push({ id, cap: '', w: rec.w, h: rec.h, full: rec.w / rec.h >= 2 });
      added++;
    } catch (e) { failed = true; }
  }
  GAL_BUSY.delete(fid);
  if (added) { delete S.auto[fid]; touch(); }
  refreshField(fid);
  scheduleProgress();
  if (failed) toast(T('imgFail')); else if (added) toast(T('imgAdded', added));
}
function openImage(fid, i) {
  const it = (S.d[fid] || [])[i];
  const e = it && IMG[it.id];
  if (!e) return;
  dlg({ title: it.cap || tr(FIELD[fid].l), body: `<img class="lightbox" src="${e.url}" alt="${esc(it.cap || '')}">`, buttons: [{ id: 'c', label: T('btnClose'), kind: 'primary' }] });
}

/* ── export / import ────────────────────────────────────────────────── */
/* text-only versions (copy / view): images are only included when downloading */
function exportText(kind) {
  if (kind === 'md') return docMD(buildDoc({ images: false }));
  if (kind === 'html') return htmlPage(buildDoc({ images: false }));
  return JSON.stringify({ app: 'gdd-assistant', version: 1, exportedAt: new Date().toISOString(), state: exportState(), images: {} }, null, 2);
}
async function backupJSON() {
  const ids = [...galleryIds()];
  await prepImages(ids, true);
  const images = {};
  ids.forEach((id) => { if (IMG[id] && IMG[id].dataUrl) images[id] = IMG[id].dataUrl; });
  return JSON.stringify({ app: 'gdd-assistant', version: 1, exportedAt: new Date().toISOString(), state: exportState(), images }, null, 2);
}
const DOCX_MIME = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
async function buildExport(kind) {
  const base = fileBase();
  if (kind === 'json') return { name: `${base}.json`, data: await backupJSON(), mime: 'application/json' };
  const doc = buildDoc();
  const ids = docImageIds(doc);
  if (kind === 'docx') { await prepImages(ids, false); return { name: `${base}.docx`, data: makeDocx(doc), mime: DOCX_MIME }; }
  if (kind === 'html') { await prepImages(ids, true); return { name: `${base}.html`, data: htmlPage(doc), mime: 'text/html;charset=utf-8' }; }
  if (ids.length) {
    await prepImages(ids, false);
    const enc = new TextEncoder();
    const files = [{ name: `${base}.md`, data: enc.encode(docMD(doc)) }].concat(imageList(doc).map((x) => ({ name: x.path, data: IMG[x.id].bytes })));
    return { name: `${base}.zip`, data: zipBlob(files, 'application/zip'), mime: 'application/zip' };
  }
  return { name: `${base}.md`, data: docMD(doc), mime: 'text/markdown;charset=utf-8' };
}
/* plain browser download: works in a normal tab, is ignored inside the sandboxed viewer */
function anchorDownload(name, data, mime) {
  /* plain-ASCII file name: some platforms drop the extension from non-Latin names in anchor downloads */
  const m = /\.([A-Za-z0-9]+)$/.exec(name);
  const stem = name.replace(/\.[A-Za-z0-9]+$/, '').replace(/[^\x00-\x7F]+/g, '').replace(/[^A-Za-z0-9._ -]+/g, '').trim().replace(/\s+/g, '-').replace(/-{2,}/g, '-').replace(/^[-.]+|[-.]+$/g, '') || 'GDD';
  name = m ? `${stem}.${m[1]}` : stem;
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener'; a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 5000);
}
function inFrame() { try { return window.top !== window.self; } catch (e) { return true; } }
function blockedToast(kind, key) {
  const act = (kind === 'docx' || kind === 'html') ? { label: T('cpRich'), cb: copyRich } : { label: T('copy'), cb: () => copyText(exportText(kind)) };
  toast(T(key), act);
}
async function doDownload(kind) {
  /* inside the sandboxed viewer a page cannot start downloads itself, so only the capability can save files */
  if (!DL && inFrame()) { blockedToast(kind, 'noDownload'); return; }
  try {
    const x = await buildExport(kind);
    if (DL) {
      await DL.save({ filename: x.name, data: x.data });
      toast(T('fileSaved'));
    } else {
      anchorDownload(x.name, x.data, x.mime);
      toast(T('dlTried'));
    }
  } catch (e) {
    const code = e && e.code;
    const msg = String((e && e.message) || '');
    LASTERR = [code, msg].filter(Boolean).join(': ');
    const dp = document.querySelector('details.diag p'); if (dp) dp.textContent = diagText();
    if (code === 'declined') return;
    if (/organi[sz]ation|members? of/i.test(msg)) { DLBLOCK = true; renderPane(); blockedToast(kind, 'orgOnly'); return; }
    if (code === 'extension_not_enabled' || code === 'rejected_extension') { blockedToast(kind, 'fmtOff'); return; }
    if (['unavailable', 'not_granted', 'capability_disabled', 'capability_removed'].includes(code)) { DL = null; renderPane(); blockedToast(kind, 'noDownload'); return; }
    toast(T('fileFail'));
  }
}
/* copy the whole document as formatted text, ready to paste into Word or Google Docs */
function copyRich() {
  try {
    const doc = buildDoc();
    docImageIds(doc).forEach((id) => {
      const e = IMG[id];
      if (e && !e.dataUrl) { e.bytes = e.bytes || new Uint8Array(e.buf); e.dataUrl = `data:${e.type};base64,${b64(e.bytes)}`; }
    });
    const holder = document.createElement('div');
    holder.setAttribute('aria-hidden', 'true');
    holder.style.cssText = 'position:fixed;top:0;left:-10000px;width:820px;background:#fff';
    holder.innerHTML = `<article class="gdd" lang="${doc.lang}" dir="${doc.dir}">${docHTML(doc, { embed: true })}</article>`;
    document.body.appendChild(holder);
    const sel = window.getSelection();
    const range = document.createRange();
    range.selectNodeContents(holder);
    sel.removeAllRanges();
    sel.addRange(range);
    const ok = document.execCommand('copy');
    sel.removeAllRanges();
    holder.remove();
    toast(ok ? T('richCopied') : T('copyFail'));
  } catch (e) { toast(T('copyFail')); }
}

function measureImage(rec) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(new Blob([rec.buf], { type: rec.type }));
    const im = new Image();
    im.onload = () => { resolve({ w: im.naturalWidth, h: im.naturalHeight }); URL.revokeObjectURL(url); };
    im.onerror = () => { resolve({ w: 1200, h: 800 }); URL.revokeObjectURL(url); };
    im.src = url;
  });
}
async function doImport(file) {
  try {
    const o = JSON.parse(await file.text());
    const st = o && o.state ? o.state : o;
    if (!st || st.v !== 1 || !st.d || typeof st.d !== 'object') throw new Error('bad');
    if (!(await yesNo(T('importBtn'), T('confirmImport')))) return;
    S = normalizeState(st);
    S.t = Date.now();
    S.step = 0; S.tab = 'edit';
    const pics = (o && o.images && typeof o.images === 'object') ? o.images : {};
    for (const id of galleryIds()) {
      const rec = IMG_ID.test(id) ? dataUrlToRec(pics[id]) : null;
      if (!rec) continue;
      SECTIONS.forEach((sec) => sec.f.forEach((f) => { if (f.k === 'images') (S.d[f.id] || []).forEach((it) => { if (it.id === id) { rec.w = rec.w || it.w; rec.h = rec.h || it.h; } }); }));
      if (!rec.w || !rec.h) { const m = await measureImage(rec); rec.w = m.w; rec.h = m.h; }
      await storeImage(id, rec);
    }
    await gcImages();
    saveUi(); touch(); writeLocal(); renderAll(); scrollTop();
    toast(T('importOk'));
  } catch (e) { toast(T('importBad')); }
}

/* ── AI (optional: only when the Claude capability is present) ──────── */
function briefText() {
  const d = S.d;
  const en = (list, v) => { const o = optLabel(list, v); return o ? o[1] : ''; };
  const many = (list, arr) => (arr || []).map((v) => en(list, v)).filter(Boolean).join(', ');
  const lines = [
    `Title: ${d.title || '(untitled)'}`, `Genres: ${many(OPT.genres, d.genres) || '(not set)'}`, `Platforms: ${many(OPT.platforms, d.platforms) || '(not set)'}`,
    `Engine: ${en(OPT.engines, d.engine)}`, `Perspective: ${en(OPT.persp, d.persp)}`, `Player modes: ${many(OPT.players, d.players)}`,
    `Audience: ${en(OPT.audience, d.audience)}`, `Business model: ${en(OPT.model, d.model)}`, `Team: ${en(OPT.team, d.teamSize)}; scope: ${en(OPT.scope, d.scope)}`
  ];
  [['highConcept', 'High concept'], ['coreLoop', 'Core loop']].forEach(([k, l]) => { if (nz(k)) lines.push(`${l}: ${String(S.d[k]).slice(0, 500)}`); });
  return lines.join('\n');
}
function aiPrompt(f, imgs) {
  const lang = S.lang === 'ar' ? 'Arabic (clear, natural game-industry wording; keep engine, package and tool names in English)' : 'English';
  const cur = S.d[f.id];
  const current = isEmpty(f, cur) ? '' : (typeof cur === 'string' ? cur : JSON.stringify(cur));
  let format;
  if (f.k === 'text') format = 'Reply with a single line of plain text, without quotes.';
  else if (f.k === 'area') format = 'Reply with plain text only: one to three short paragraphs and/or lines starting with "- ". No headings. Use **bold** sparingly. Be concrete and specific to this game; avoid filler.';
  else if (f.k === 'list') format = 'Reply with only a JSON array of 3 to 6 short strings.';
  else if (f.k === 'colors') format = 'Reply with only a JSON array of 5 items, each [hex, name], for example ["#E8590C","Primary"]. Names in the requested language.';
  else {
    const sels = f.cols.filter((c) => c.k === 'sel').map((c) => `Column "${c.l[1]}" must be exactly one of: ${c.o.map((o) => o[0]).join(', ')}.`).join(' ');
    format = `Reply with only a JSON array of 3 to 8 rows. Each row is an array of strings in exactly this column order: ${f.cols.map((c) => c.l[1]).join(' | ')}. ${sels}`;
  }
  const what = imgs
    ? `Write the GDD field "${f.l[1]}" (${f.h ? f.h[1] : ''}) from the attached images.\nThe attached images are ${IMG_ROLE[imgs.gid]}. In order:\n${imgs.items.map((it, n) => `Image ${n + 1}: ${it.cap ? it.cap : '(no caption)'}`).join('\n')}\nDescribe what is actually visible and refer to images by number when useful. Do not invent details that cannot be seen. Combine it with the project context.`
    : `Write the GDD field "${f.l[1]}" (${f.h ? f.h[1] : ''}).`;
  return `You are a senior game designer and technical director writing a professional Game Design Document (GDD).\nWrite in ${lang}.\n\nPROJECT\n${briefText()}\n\nTASK\n${what}\n${current ? `Current content. Improve and extend it, keeping the author's intent and facts:\n${current}` : 'The field is empty. Write it from scratch.'}\n\nFORMAT\n${format}`;
}
function cleanAI(t) {
  return String(t || '').replace(/^```[a-z]*\n?/i, '').replace(/\n?```$/, '').replace(/^\s*[*•]\s+/gm, '- ').trim();
}
function normCell(c, v) {
  const s = v == null ? '' : String(v).trim();
  if (c.k === 'sel') {
    const low = s.toLowerCase();
    const o = c.o.find((x) => x[0] === low || x[1].some((l) => l.toLowerCase() === low));
    return o ? o[0] : (c.def || '');
  }
  return s;
}
function coerceAI(f, raw) {
  if (!Array.isArray(raw) && raw && typeof raw === 'object') raw = Object.values(raw).find(Array.isArray);
  if (!Array.isArray(raw) || !raw.length) return null;
  if (f.k === 'list') {
    const a = raw.map((x) => (typeof x === 'string' ? x : (x && (x.text || x.name || x.title || x.item)) || '')).map((s) => String(s).trim()).filter(Boolean);
    return a.length ? a : null;
  }
  if (f.k === 'colors') {
    const a = raw.map((x) => (Array.isArray(x) ? [x[0], x[1]] : (x && typeof x === 'object' ? [x.hex || x.color || x.c, x.name || x.n] : null)))
      .filter((x) => x && HEX.test(String(x[0]).trim())).map((x) => [String(x[0]).trim(), String(x[1] || '')]).slice(0, f.max || 8);
    return a.length ? a : null;
  }
  const rows = raw.map((r) => {
    const cells = Array.isArray(r) ? r : (r && typeof r === 'object' ? Object.values(r) : null);
    return cells ? f.cols.map((c, i) => normCell(c, cells[i])) : null;
  }).filter((r) => r && r.some((x) => x));
  return rows.length ? rows : null;
}
function aiErrText(e) {
  const code = e && e.code;
  if (code === 'bad_format') return T('aiBadFormat');
  return tr(STR.aiErr[code] || STR.aiErr.fallback);
}
function aiGone(code) {
  if (code === 'images_unavailable') { IMGLIM = null; renderPane(); return; }
  if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) {
    AI = null;
    renderPane();
  }
}
async function doAiField(fid, opts = {}) {
  const f = FIELD[fid];
  if (!AI || !f || AIB.has(fid)) return;
  let imgs = null;
  if (opts.gallery) {
    const all = (S.d[opts.gallery] || []).filter((it) => IMG[it.id]);
    if (!all.length) { toast(T('aiNeedImages')); return; }
    const max = (IMGLIM && IMGLIM.maxCount) || 4;
    const items = all.slice(0, max);
    if (all.length > items.length) toast(T('aiImgLimit', max));
    imgs = { gid: opts.gallery, items, blobs: items.map((it) => new Blob([IMG[it.id].buf], { type: IMG[it.id].type })) };
  }
  const extra = imgs ? { images: imgs.blobs } : {};
  const prev = clone(S.d[fid] ?? emptyValue(f));
  const prevAuto = !!S.auto[fid];
  const ctl = new AbortController();
  AIB.set(fid, ctl);
  refreshField(fid);
  try {
    let result;
    if (f.k === 'text' || f.k === 'area') {
      const r = await AI(aiPrompt(f, imgs), Object.assign({
        signal: ctl.signal,
        onText: ({ text }) => { const el = document.getElementById('i-' + fid); if (el) { el.value = text; if (el.tagName === 'TEXTAREA') autosize(el); } }
      }, extra));
      result = cleanAI(r.text);
    } else {
      result = coerceAI(f, await AI.json(aiPrompt(f, imgs), Object.assign({ signal: ctl.signal }, extra)));
    }
    if (result == null || result === '') throw { code: 'bad_format' };
    UNDO = { fid, prev, prevAuto };
    S.d[fid] = result;
    delete S.auto[fid];
    touch();
    toast(T('aiDone'), { label: T('undo'), cb: doUndo });
  } catch (e) {
    if (!e || e.code !== 'cancelled') { toast(aiErrText(e)); aiGone(e && e.code); }
  } finally {
    AIB.delete(fid);
    refreshField(fid);
    scheduleProgress();
  }
}
async function doAiReview() {
  if (!AI || AIREV.busy) return;
  const md = docMD(buildDoc()).slice(0, 120000);
  const lang = S.lang === 'ar' ? 'Arabic' : 'English';
  const prompt = `You are a veteran game producer and technical director reviewing a Game Design Document (GDD).\nWrite in ${lang}; keep engine, package and tool names in English.\n\nReview the GDD below and return:\n1. One sentence of overall verdict.\n2. The 6 to 8 most important issues, ordered by impact. For each: a short **bold title**, why it matters (one sentence) and a concrete fix (one sentence). Cover design clarity, scope versus team size, technical feasibility and performance, monetization and ethics, missing or thin sections, and contradictions.\nBe specific to this document. No generic praise. Plain text with "1." numbering and **bold** titles only.\n\nGDD:\n${md}`;
  AIREV = { busy: true, text: '', err: '', ctl: new AbortController() };
  paintReviewAI();
  try {
    const r = await AI(prompt, { signal: AIREV.ctl.signal, onText: ({ text }) => { AIREV.text = text; paintReviewAI(); } });
    AIREV.text = r.text;
  } catch (e) {
    if (e && e.text) AIREV.text = e.text;
    if (!e || e.code !== 'cancelled') { AIREV.err = aiErrText(e); aiGone(e && e.code); }
  } finally {
    AIREV.busy = false;
    paintReviewAI();
  }
}

/* ── event wiring ───────────────────────────────────────────────────── */
async function onClick(e) {
  const j = e.target.closest('[data-jump]');
  if (j) {
    e.preventDefault();
    const t = document.getElementById(j.dataset.jump);
    if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const a = b.dataset.act;
  const fid = b.dataset.f;
  const f = fid ? FIELD[fid] : null;
  const i = +b.dataset.i;
  switch (a) {
    case 'menu': { const ap = $('#app'); ap.classList.add('anim'); ap.classList.toggle('menu-open'); setTimeout(() => ap.classList.remove('anim'), 320); break; }
    case 'lang': setLang(b.dataset.l); break;
    case 'tab': setTab(b.dataset.t); break;
    case 'step': go(i); break;
    case 'prev': go(S.step - 1); break;
    case 'next': if (S.step >= SECTIONS.length - 1) setTab('preview'); else go(S.step + 1); break;
    case 'chip': {
      const v = b.dataset.v;
      let arr = S.d[fid] || [];
      if (arr.includes(v)) arr = arr.filter((x) => x !== v);
      else {
        if (f.max && arr.length >= f.max) { toast(T('maxN', f.max)); break; }
        arr = [...arr, v];
      }
      S.d[fid] = arr;
      delete S.auto[fid];
      touch(); refreshField(fid);
      if (CTX_IDS.has(fid)) scheduleRefresh();
      scheduleProgress();
      break;
    }
    case 'li-add': mutate(fid, () => { (S.d[fid] = S.d[fid] || []).push(''); }); focusLast(fid, '.li'); break;
    case 'li-del': mutate(fid, () => { S.d[fid].splice(i, 1); }); break;
    case 'row-add': mutate(fid, () => { (S.d[fid] = S.d[fid] || []).push(newRow(f)); }); focusLast(fid, '.rowc'); break;
    case 'row-del': mutate(fid, () => { S.d[fid].splice(i, 1); }); break;
    case 'col-add': mutate(fid, () => { (S.d[fid] = S.d[fid] || []).push(['#1971C2', '']); }); break;
    case 'gen': doGenField(fid); break;
    case 'ai': doAiField(fid); break;
    case 'ai-img': if (IMG_TARGET[fid]) doAiField(IMG_TARGET[fid], { gallery: fid }); break;
    case 'ai-stop': { const c = AIB.get(fid); if (c) c.abort(); break; }
    case 'gen-sec': doGenSection(); break;
    case 'clear-sec': doClearSection(); break;
    case 'gen-all': doGenAll(); break;
    case 'new': doNew(); break;
    case 'goto': gotoField(b.dataset.s, fid); break;
    case 'dl': doDownload(b.dataset.k); break;
    case 'cp': copyText(exportText(b.dataset.k)); break;
    case 'cp-rich': copyRich(); break;
    case 'vt': viewText(exportText(b.dataset.k)); break;
    case 'import': $('#importFile').click(); break;
    case 'img-add': { const inp = $(`input[type="file"][data-gal="${fid}"]`); if (inp) inp.click(); break; }
    case 'img-del': { const it = (S.d[fid] || [])[i]; mutate(fid, () => { S.d[fid].splice(i, 1); }); if (it) dropImage(it.id); break; }
    case 'img-prev': if (i > 0) mutate(fid, () => { const a = S.d[fid]; [a[i - 1], a[i]] = [a[i], a[i - 1]]; }); break;
    case 'img-next': if (i < (S.d[fid] || []).length - 1) mutate(fid, () => { const a = S.d[fid]; [a[i + 1], a[i]] = [a[i], a[i + 1]]; }); break;
    case 'img-full': mutate(fid, () => { const it = S.d[fid][i]; it.full = !it.full; }); break;
    case 'img-open': openImage(fid, i); break;
    case 'ai-review': doAiReview(); break;
    case 'ai-review-stop': if (AIREV.ctl) AIREV.ctl.abort(); break;
    default: break;
  }
}

function onInput(e) {
  const el = e.target;
  if (el.type === 'file' && el.dataset && el.dataset.gal) {
    if (e.type === 'change') { const files = Array.from(el.files || []); const gid = el.dataset.gal; el.value = ''; addImages(gid, files); }
    return;
  }
  if (el.id === 'showEmpty') { S.showEmpty = el.checked; touch(); renderPane(); return; }
  const fid = el.dataset && el.dataset.f;
  if (!fid || !FIELD[fid] || el.dataset.act) return;
  const f = FIELD[fid];
  const i = +el.dataset.i;
  const c = +el.dataset.c;
  const v = el.value;
  if (f.k === 'list') { const a = (S.d[fid] = S.d[fid] || []); a[i] = v; }
  else if (f.k === 'table') { const rows = S.d[fid]; if (!rows || !rows[i]) return; rows[i][c] = v; }
  else if (f.k === 'images') { const it = (S.d[fid] || [])[i]; if (!it) return; it.cap = v; }
  else if (f.k === 'colors') {
    const a = S.d[fid];
    if (!a || !a[i]) return;
    a[i][c] = v;
    if (c === 0) { const hex = el.parentElement.querySelector('.hex'); if (hex) hex.textContent = v.toUpperCase(); }
  } else if (['text', 'area', 'date', 'sel'].includes(f.k)) S.d[fid] = v;
  else return;
  if (el.tagName === 'TEXTAREA') autosize(el);
  if (el.tagName !== 'SELECT' && el.type !== 'color' && el.type !== 'date') el.dir = dirFor(v);
  if (S.auto[fid]) {
    delete S.auto[fid];
    const box = document.getElementById('f-' + fid);
    if (box) { box.classList.remove('is-auto'); const bd = $('.badge', box); if (bd) bd.remove(); }
  }
  touch();
  if (CTX_IDS.has(fid)) scheduleRefresh();
  scheduleProgress();
}

function bind() {
  document.addEventListener('click', onClick);
  $('#pane').addEventListener('input', onInput);
  $('#pane').addEventListener('change', onInput);
  $('#importFile').addEventListener('change', (e) => { const file = e.target.files && e.target.files[0]; e.target.value = ''; if (file) doImport(file); });
  const pane = $('#pane');
  const gal = (t) => (t && t.closest ? t.closest('.field[data-gal]') : null);
  const hasFiles = (e) => !!e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
  pane.addEventListener('dragover', (e) => { const g = gal(e.target); if (g && hasFiles(e)) { e.preventDefault(); g.classList.add('over'); } });
  pane.addEventListener('dragleave', (e) => { const g = gal(e.target); if (g && !g.contains(e.relatedTarget)) g.classList.remove('over'); });
  pane.addEventListener('drop', (e) => { const g = gal(e.target); if (!g) return; e.preventDefault(); g.classList.remove('over'); addImages(g.dataset.gal, Array.from(e.dataTransfer.files || [])); });
  window.addEventListener('dragover', (e) => { if (!gal(e.target)) e.preventDefault(); });
  window.addEventListener('drop', (e) => { if (!gal(e.target)) e.preventDefault(); });
  document.addEventListener('paste', (e) => {
    const g = gal(document.activeElement);
    if (!g) return;
    const files = Array.from((e.clipboardData && e.clipboardData.files) || []).filter(isImgFile);
    if (!files.length) return;
    e.preventDefault();
    addImages(g.dataset.gal, files);
  });
  window.addEventListener('pagehide', flushSave);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSave(); });
}

/* ── capabilities from the Claude viewer (all optional) ─────────────── */
async function initCloud(db, us) {
  try {
    const id = await us.id();
    if (!id) return;
    CLOUD.ref = db.collection('data/users/' + id).doc('gdd-project');
    const snap = await Promise.race([CLOUD.ref.get(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000))]);
    let adopt = null;
    if (snap.exists) {
      const data = snap.data() || {};
      let cloud = null;
      try { cloud = JSON.parse(data.json); } catch (e) { cloud = null; }
      const ct = +data.t || 0;
      if (cloud && cloud.d && (S.sample || ct > S.t)) adopt = { cloud, t: ct };
      else if (S.t > ct) CLOUD.dirty = true;
    } else if (S.t > 0) CLOUD.dirty = true;
    CLOUD.ready = true;
    if (adopt) {
      const ui = { step: S.step, tab: S.tab };
      S = normalizeState(adopt.cloud);
      S.t = adopt.t; S.step = ui.step; S.tab = ui.tab;
      writeLocal(); renderAll(); setSave('cloud');
      toast(T('cloudLoaded'));
    } else if (CLOUD.dirty) pushCloud();
    else setSave('cloud');
  } catch (e) { CLOUD.ready = false; }
}
function initCaps(tries = 0) {
  const c = window.claude;
  /* the runtime can be injected a moment after the page starts: wait for it instead of giving up */
  if (!c || typeof c.use !== 'function') { if (tries < 40) setTimeout(() => initCaps(tries + 1), 250); return; }
  const get = (n) => Promise.resolve().then(() => c.use(n)).catch((e) => { if (n === 'downloads') LASTERR = 'use(downloads): ' + String((e && (e.code || e.message)) || e); return null; });
  const repaint = () => { const a = document.activeElement; if (!a || ['BODY', 'HTML', 'BUTTON'].includes(a.tagName)) renderPane(); };
  get('downloads').then((x) => { DL = x || null; repaint(); });
  get('sample').then((x) => {
    AI = x || null;
    repaint();
    if (AI && typeof AI.limits === 'function') AI.limits().then((l) => { IMGLIM = (l && l.images) || null; repaint(); }).catch(() => {});
  });
  Promise.all([get('db'), get('user')]).then(([db, us]) => { if (db && us) initCloud(db, us); });
}

/* ── boot ───────────────────────────────────────────────────────────── */
function boot(data) {
  const st = document.createElement('style');
  st.textContent = DOC_CSS;
  document.head.appendChild(st);
  S = (data && data.s ? normalizeState(data.s) : null) || loadLocal() || sampleState();
  loadUi();
  applyLang();
  renderAll();
  bind();
  initCaps();
  initImages();
}
async function initImages() {
  await idbOpen();
  await loadAllImages();
  if (S.sample) await seedSampleImages();
  imgReady = true;
  const a = document.activeElement;
  if (galleryIds().size && ['edit', 'preview'].includes(S.tab) && (!a || ['BODY', 'HTML', 'BUTTON'].includes(a.tagName))) renderPane();
}
(function start() {
  const hot = window.claude && window.claude.hot;
  try { if (hot && hot.snapshot) hot.snapshot(() => ({ s: exportState() })); } catch (e) { /* ignore */ }
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
