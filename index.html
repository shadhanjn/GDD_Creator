<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مساعد GDD</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="description" content="مساعد لإنشاء وثيقة تصميم اللعبة (GDD) كاملة، عربي / English، مع تصدير Word مع الصور · Game Design Document assistant with Word export">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout idea: a blueprint-ink workspace on a faint drafting grid; the paper preview is the hero, orange marks what you act on. */
:root {
  --bg: #EDF1F6; --surface: #FFFFFF; --ink: #13202E; --muted: #58687B; --line: #D6DEE8;
  --brand: #1B4F9C; --brand-ink: #FFFFFF; --accent: #C2410C; --accent-ink: #FFFFFF;
  --soft: #F4F7FB; --brand-soft: #E3ECF9; --accent-soft: #FCEBE1; --ring: rgba(27, 79, 156, .22);
  --ok: #2B8A3E; --warn: #B7791F; --bad: #C92A2A; --grid: rgba(27, 79, 156, .07);
  --toast-bg: #13202E; --toast-ink: #FFFFFF;
  --radius: 12px; --shadow: 0 1px 2px rgba(19, 32, 46, .06), 0 8px 24px rgba(19, 32, 46, .07);
  --font-ui: 'IBM Plex Sans Arabic', 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
  --font-display: 'Reem Kufi', 'IBM Plex Sans Arabic', 'IBM Plex Sans', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1220; --surface: #121C2D; --ink: #E7EDF6; --muted: #9AA9BD; --line: #25354D;
    --brand: #78A9FF; --brand-ink: #0B1220; --accent: #FF8A4C; --accent-ink: #1A0E06;
    --soft: #0F1828; --brand-soft: #172840; --accent-soft: #2A1A12; --ring: rgba(120, 169, 255, .3);
    --ok: #69DB7C; --warn: #FFD43B; --bad: #FF8787; --grid: rgba(120, 169, 255, .06);
    --toast-bg: #E7EDF6; --toast-ink: #0B1220; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1220; --surface: #121C2D; --ink: #E7EDF6; --muted: #9AA9BD; --line: #25354D;
  --brand: #78A9FF; --brand-ink: #0B1220; --accent: #FF8A4C; --accent-ink: #1A0E06;
  --soft: #0F1828; --brand-soft: #172840; --accent-soft: #2A1A12; --ring: rgba(120, 169, 255, .3);
  --ok: #69DB7C; --warn: #FFD43B; --bad: #FF8787; --grid: rgba(120, 169, 255, .06);
  --toast-bg: #E7EDF6; --toast-ink: #0B1220; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100%; background-color: var(--bg); color: var(--ink);
  font: 400 16px/1.6 var(--font-ui); -webkit-font-smoothing: antialiased;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
}
button, input, select, textarea { font-family: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.ico { flex: none; }
[dir="rtl"] .flip { transform: scaleX(-1); }
.grow { flex: 1; }
.muted { color: var(--muted); }
.err { color: var(--bad); }
[hidden] { display: none !important; }

/* ── top bar ── */
.topwrap { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top { display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 8px max(16px, calc((100% - 1240px) / 2 + 24px)); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { font: 600 12px/1 var(--font-mono); background: var(--accent); color: var(--accent-ink); padding: 7px 8px; border-radius: 8px; letter-spacing: .04em; direction: ltr; }
.bn { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.bn b { font: 700 18px var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bn small { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.save { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.save i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.save.saving i { background: var(--warn); animation: pulse 1s ease-in-out infinite; }
.save.err i { background: var(--bad); }
.save.err { color: var(--bad); }
.lang { display: inline-flex; gap: 2px; padding: 3px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--soft); }
.lang button { border: 0; background: transparent; color: var(--muted); font: 700 16px/1 var(--font-ui); width: 42px; height: 34px; border-radius: 999px; cursor: pointer; }
.lang button[lang="ar"] { font-size: 20px; padding-bottom: 3px; }
.lang button.on { background: var(--brand); color: var(--brand-ink); }
.bar { height: 3px; background: var(--line); }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .45s ease; }

/* ── shell ── */
.shell { display: grid; grid-template-columns: minmax(0, 1fr); max-width: 1240px; margin: 0 auto; padding: 0 16px; }
.main { min-width: 0; padding: 16px 0 24px; }
.side { background: var(--surface); }
.scrim { display: none; }
@media (min-width: 960px) {
  .shell { grid-template-columns: 292px minmax(0, 1fr); gap: 28px; padding: 0 24px; }
  .side { position: sticky; top: 76px; align-self: start; max-height: calc(100vh - 92px); overflow: auto; margin-top: 20px; border: 1px solid var(--line); border-radius: var(--radius); }
  .top .menu-btn, .side .close-btn { display: none; }
}
@media (max-width: 959px) {
  .side { position: fixed; inset-block: 0; inset-inline-start: 0; width: min(86vw, 330px); z-index: 40; transform: translateX(-105%); overflow: auto; display: flex; flex-direction: column; box-shadow: var(--shadow); }
  [dir="rtl"] .side { transform: translateX(105%); }
  .anim .side { transition: transform .25s ease; }
  .menu-open .side { transform: none; }
  .scrim { display: block; position: fixed; inset: 0; background: rgba(10, 18, 30, .5); z-index: 35; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .menu-open .scrim { opacity: 1; pointer-events: auto; }
  .save span { max-width: 72px; overflow: hidden; text-overflow: ellipsis; }
}
@media (max-width: 480px) {
  .save span { display: none; }
  .save.err span { display: inline; }
  .bn small { display: none; }
  .top { gap: 8px; }
}

.side-head { display: flex; align-items: center; gap: 10px; padding: 16px 16px 8px; }
.proj { min-width: 0; flex: 1; }
.proj b { display: block; font: 700 19px/1.25 var(--font-display); overflow-wrap: anywhere; }
.proj small { color: var(--muted); font-size: 12.5px; }
.steps { display: flex; flex-direction: column; padding: 4px 8px; }
.step { display: grid; grid-template-columns: 30px 1fr 36px; align-items: center; gap: 8px; text-align: start; padding: 10px; border: 0; background: transparent; border-radius: 9px; color: var(--ink); font: 500 14.5px var(--font-ui); cursor: pointer; }
.step:hover { background: var(--soft); }
.step.cur { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.sn { font: 600 12px var(--font-mono); color: var(--muted); direction: ltr; text-align: start; }
.step.cur .sn { color: var(--brand); }
.sp { height: 4px; border-radius: 4px; background: var(--line); position: relative; overflow: hidden; }
.sp::after { content: ''; position: absolute; inset-block: 0; inset-inline-start: 0; width: var(--p); background: var(--brand); }
.step.done .sp::after { background: var(--ok); }
.side-foot { display: grid; gap: 8px; padding: 12px 16px 16px; border-top: 1px solid var(--line); margin-top: 8px; }

/* ── tabs ── */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; scrollbar-width: none; }
.tab { position: relative; border: 0; background: transparent; padding: 12px 14px; font: 600 15px var(--font-ui); color: var(--muted); cursor: pointer; white-space: nowrap; }
.tab.on { color: var(--ink); }
.tab.on::after { content: ''; position: absolute; inset-inline: 10px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); }
.cnt { margin-inline-start: 6px; background: var(--accent); color: var(--accent-ink); border-radius: 999px; font: 700 11px var(--font-ui); padding: 2px 7px; }

/* ── buttons + inputs ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: 600 15px var(--font-ui); cursor: pointer; transition: border-color .15s, filter .15s, transform .05s; text-align: center; }
.btn:hover { border-color: var(--brand); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: 14px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.ibtn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 9px; border: 0; background: transparent; color: var(--muted); cursor: pointer; flex: none; }
.ibtn:hover { background: var(--soft); color: var(--ink); }
.ibtn.ai { color: var(--accent); }
.ibtn[disabled] { opacity: .4; cursor: not-allowed; }

.inp { width: 100%; font: 400 16px/1.55 var(--font-ui); color: var(--ink); background: var(--soft); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; transition: border-color .15s, box-shadow .15s; }
.inp:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--ring); background: var(--surface); }
.inp::placeholder { color: var(--muted); opacity: .75; }
.inp[disabled] { opacity: .65; }
textarea.inp { resize: vertical; min-height: 88px; display: block; }
textarea.inp.sm { min-height: 64px; }
textarea.mono { font-family: var(--font-mono); font-size: 13px; }
select.inp { appearance: none; -webkit-appearance: none; padding-inline-end: 38px; cursor: pointer; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2358687B' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>"); background-repeat: no-repeat; background-position: center right 13px; }
[dir="rtl"] select.inp { background-position: center left 13px; }
input[type="date"].inp { text-align: start; }

/* ── image galleries ── */
.gal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; }
.tile { margin: 0; display: grid; gap: 8px; align-content: start; background: var(--soft); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px; }
.tile.is-full { border-color: var(--brand); }
.thumb { display: block; width: 100%; aspect-ratio: 4 / 3; padding: 0; border: 0; border-radius: 7px; overflow: hidden; background: var(--line); cursor: zoom-in; position: relative; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.missing, .thumb.loading { display: grid; place-items: center; cursor: default; color: var(--muted); font-size: 12.5px; text-align: center; padding: 8px; }
.thumb.loading { background: linear-gradient(100deg, var(--line) 30%, var(--soft) 50%, var(--line) 70%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
.tile .inp { min-height: 38px; font-size: 14px; padding: 7px 10px; background: var(--surface); }
.tile-acts { display: flex; gap: 2px; flex-wrap: wrap; }
.ibtn.on { background: var(--brand-soft); color: var(--brand); }
.drop { display: grid; place-items: center; align-content: center; gap: 8px; min-height: 150px; border: 2px dashed var(--line); border-radius: 10px; background: transparent; color: var(--muted); font: 600 14px var(--font-ui); cursor: pointer; padding: 12px; text-align: center; }
.drop:hover, .field.over .drop { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
.drop[disabled] { opacity: .6; cursor: progress; }
.drop .ico { width: 26px; height: 26px; }
.field.over { box-shadow: 0 0 0 3px var(--ring); }
.f-hint.tight { margin: 10px 0 0; }
.lightbox { display: block; max-width: 100%; max-height: 68vh; margin: 0 auto; border-radius: 8px; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* ── section head ── */
.sec-head { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 14px; }
.sec-no { font: 700 56px/1 var(--font-display); color: var(--brand); direction: ltr; min-width: 2ch; }
.sec-head h1 { font: 700 30px/1.25 var(--font-display); margin: 2px 0 6px; text-wrap: balance; }
.intro { margin: 0; color: var(--muted); max-width: 64ch; }
.h-page { font: 700 30px/1.25 var(--font-display); margin: 0 0 6px; }
.h-sub { display: flex; align-items: center; gap: 8px; font: 700 19px var(--font-display); margin: 24px 0 10px; }
.sec-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.chip-n { font: 600 12.5px var(--font-mono); color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; direction: ltr; }
.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: var(--accent-soft); border: 1px solid var(--line); border-inline-start: 4px solid var(--accent); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 18px; }
.banner p { margin: 0; flex: 1 1 240px; font-size: 14.5px; }
.note { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; font-size: 14.5px; }
.ok-note { background: var(--surface); border: 1px solid var(--line); border-inline-start: 4px solid var(--ok); border-radius: 10px; padding: 12px 14px; }

/* ── fields ── */
.fields { display: grid; gap: 14px; }
.field { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px 16px; scroll-margin-top: 90px; }
.field.is-auto { border-inline-start: 3px solid var(--brand); }
.field.flash { animation: flash 1.7s ease; }
.f-head { display: flex; align-items: center; gap: 8px; min-height: 40px; }
.f-label { font: 600 15.5px var(--font-ui); }
.req { color: var(--accent); margin-inline-start: 4px; }
.badge { font: 600 11px var(--font-ui); color: var(--brand); background: var(--brand-soft); padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.f-acts { margin-inline-start: auto; display: flex; gap: 2px; }
.f-hint { margin: 0 0 10px; color: var(--muted); font-size: 13.5px; line-height: 1.55; }
.ai-busy { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; color: var(--accent); font-size: 14px; }
.ai-busy i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent; animation: spin .8s linear infinite; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 7px; border: 1.5px solid var(--line); background: var(--soft); color: var(--ink); padding: 8px 14px; min-height: 42px; border-radius: 999px; font: 500 14.5px var(--font-ui); cursor: pointer; transition: background .15s, border-color .15s; }
.chip:hover { border-color: var(--brand); }
.chip.on { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.rank { font: 700 11px/1 var(--font-mono); background: var(--accent); color: var(--accent-ink); border-radius: 50%; width: 19px; height: 19px; display: inline-grid; place-items: center; font-style: normal; }

.list, .tbl, .pal { display: grid; gap: 8px; }
.li { display: flex; gap: 6px; align-items: center; }
.add { justify-self: start; }
.tbl { gap: 10px; }
.rowc { border: 1.5px solid var(--line); border-radius: 10px; background: var(--soft); padding: 8px 12px 12px; }
.rowc-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
.rown { font: 600 12px var(--font-mono); color: var(--muted); }
.cells { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.cell { display: grid; gap: 4px; min-width: 0; align-content: start; }
.cl { font: 600 12.5px var(--font-ui); color: var(--muted); }
.rowc .inp { background: var(--surface); }
.rowc .inp:focus { background: var(--surface); }
@media (min-width: 760px) { .cell.w2 { grid-column: span 2; } }
.sw { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
.cp { width: 52px; height: 44px; padding: 3px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--soft); cursor: pointer; }
.hex { font: 500 13px var(--font-mono); color: var(--muted); min-width: 66px; }

.cta { margin-top: 16px; background: var(--brand); color: var(--brand-ink); border-radius: var(--radius); padding: 18px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.cta p { margin: 0; flex: 1 1 240px; font-weight: 500; }
.pager { position: sticky; bottom: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 24px -16px 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--line); }
.pg-n { font: 600 12.5px var(--font-mono); color: var(--muted); text-align: center; }
@media (min-width: 960px) { .pager { margin-inline: 0; border: 1px solid var(--line); border-radius: var(--radius); bottom: 12px; box-shadow: var(--shadow); } }

/* ── preview ── */
.pv-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.chk { display: inline-flex; align-items: center; gap: 10px; font-size: 14.5px; cursor: pointer; min-height: 40px; }
.chk input { width: 20px; height: 20px; accent-color: var(--brand); }
.paper-wrap { overflow-x: auto; }
.paper { background: #fff; color: #16222f; border-radius: 6px; box-shadow: var(--shadow); padding: 44px 54px; max-width: 900px; margin: 0 auto; }
@media (max-width: 640px) { .paper { padding: 24px 16px; } .sec-no { font-size: 40px; } .sec-head h1 { font-size: 25px; } }

/* ── review ── */
.rv-top { display: flex; align-items: center; gap: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.rv-top h1 { font: 700 26px/1.25 var(--font-display); margin: 0 0 2px; }
.ring { width: 92px; height: 92px; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0); display: grid; place-items: center; position: relative; flex: none; }
.ring::before { content: ''; position: absolute; inset: 9px; background: var(--surface); border-radius: 50%; }
.ring b { position: relative; font: 700 22px var(--font-display); direction: ltr; }
.issues { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 8px; }
.issues button { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: start; background: var(--surface); border: 1px solid var(--line); border-inline-start: 4px solid var(--accent); border-radius: 10px; padding: 12px 14px; font: 500 15px var(--font-ui); color: var(--ink); cursor: pointer; }
.issues button:hover { border-color: var(--accent); }
.issues em { font-style: normal; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
@media (max-width: 560px) { .issues button { flex-direction: column; align-items: flex-start; gap: 4px; } }
.sec-bars { display: grid; gap: 4px; }
.sbar { display: grid; grid-template-columns: 30px minmax(0, 1fr) minmax(60px, 34%) 42px; align-items: center; gap: 10px; background: transparent; border: 0; padding: 8px 6px; border-radius: 8px; text-align: start; cursor: pointer; font: 500 14.5px var(--font-ui); }
.sbar:hover { background: var(--surface); }
.sbar .st { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track { height: 6px; background: var(--line); border-radius: 6px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--brand); border-radius: 6px; }
.pc { font: 600 12.5px var(--font-mono); color: var(--muted); direction: ltr; text-align: end; }
.ai-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 16px 16px; margin-top: 24px; }
.ai-box .h-sub { margin-top: 14px; color: var(--accent); }
.ai-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.ai-out { margin-top: 12px; line-height: 1.75; }
.ai-out p, .ai-out ol, .ai-out ul { margin: 0 0 10px; }
.ai-out ol, .ai-out ul { padding-inline-start: 24px; }

/* ── export ── */
.xgrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); margin-top: 16px; }
.xcard { display: flex; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }

function optLabel(list, v) {
  const o = list.find((x) => x[0] === v);
  return o ? o[1] : null;
}

function isEmpty(f, v) {
  switch (f.k) {
    case 'multi': return !v || !v.length;
    case 'colors': return !v || !v.length;
    case 'images': return !v || !v.length;
    case 'list': return !v || !v.some((s) => String(s || '').trim());
    case 'table': return !v || !v.some((r) => r.some((c) => String(c || '').trim()));
    default: return v == null || String(v).trim() === '';
  }
}

function emptyValue(f) {
  if (['multi', 'list', 'table', 'colors', 'images'].includes(f.k)) return [];
  if (f.k === 'sel') return f.def || '';
  return '';
}

  const plat = d.platforms || [];
  const has = (k) => plat.includes(k);
  const pl = d.players || [];
  const eng = ENG[d.engine] || ENG.generic;
  const model = d.model || 'tbd';
  const title = (d.title || '').trim();
  const persOpt = optLabel(OPT.persp, d.persp);
  const langs = (d.langs && d.langs.length ? d.langs : []);
  const c = {

    mobile: has('android') || has('ios'), pc: has('pc'), vr: has('vr'), web: has('web'), con: has('console'),

'use strict';
/* Document model + renderers (preview/HTML, Markdown, Word .docx). */

const HEX = /^#[0-9a-fA-F]{6}$/;
const safeHex = (c) => (HEX.test(c) ? c : '#888888');
const AR_RE = /[֐-ࣿיִ-﷿ﹰ-﻿]/;
const hasArabic = (s) => AR_RE.test(s);
/* Direction by majority of letters, so an Arabic sentence that starts with an English term stays RTL. */
function textDir(s) {
  let ar = 0;
  let la = 0;
  for (const ch of String(s || '')) {
    if (AR_RE.test(ch)) ar++;
    else if ((ch >= 'A' && ch <= 'Z') || (ch >= 'a' && ch <= 'z')) la++;
  }
  if (!ar && !la) return null;
  return ar >= 0.3 * (ar + la) ? 'rtl' : 'ltr';
}
const dirFor = (v) => textDir(v) || (S.lang === 'ar' ? 'rtl' : 'ltr');

const KIND = { text: 'p', date: 'p', sel: 'p', area: 'rich', multi: 'chips', list: 'ul', table: 'table', colors: 'colors', images: 'images' };

function normValue(f, v) {
  switch (f.k) {
    case 'sel': { const o = optLabel(f.o, v); return o ? tr(o) : String(v); }
    case 'multi': return v.map((x) => { const o = optLabel(f.o, x); return o ? tr(o) : String(x); });
    case 'list': return v.map((s) => String(s).trim()).filter(Boolean);
    case 'table':
      return {
        head: f.cols.map((c) => tr(c.l)),
        widths: f.cols.map((c) => c.w || 1),
        rows: v.filter((r) => r.some((x) => String(x || '').trim())).map((r) => f.cols.map((c, i) => {
          const x = r[i] == null ? '' : String(r[i]);
          if (c.k === 'sel' && x) { const o = optLabel(c.o, x); return o ? tr(o) : x; }
          return x;
        }))
      };
    case 'colors': return v.filter((x) => HEX.test(x[0])).map((x) => ({ c: x[0], n: String(x[1] || '') }));
    case 'images': return v.filter((x) => IMG[x.id]).map((x) => ({ id: x.id, cap: String(x.cap || ''), full: !!x.full, w: IMG[x.id].w, h: IMG[x.id].h }));
    default: return String(v);
  }
}

function buildDoc(opts = {}) {
  const ar = S.lang === 'ar';
  const d = S.d;
  const val = (id) => String(d[id] || '').trim();
  const meta = {
    title: val('title') || tr(STR.untitled), tagline: val('tagline'), studio: val('studio'), author: val('author'),
    version: val('version'), date: val('date'), status: tr(optLabel(OPT.status, d.status || 'draft'))
  };
  const secs = [];
  SECTIONS.forEach((sec) => {
    const blocks = [];
    if (sec.id === 'setup') {
      const rows = GLANCE.map((id) => {
        const f = FIELD[id];
        const v = d[id];
        let text = '';
        if (f.k === 'multi') text = (v || []).map((x) => tr(optLabel(f.o, x))).join(ar ? '، ' : ', ');
        else { const o = optLabel(f.o, v); text = o ? tr(o) : ''; }
        return text ? [tr(f.l), text] : null;
      }).filter(Boolean);
      if (rows.length) blocks.push({ id: 'glance', label: tr(STR.glance), k: 'kv', v: rows });
    } else {
      sec.f.forEach((f) => {
        if (f.meta) return;
        if (f.k === 'images' && opts.images === false) return;
        const raw = d[f.id];
        let v = isEmpty(f, raw) ? null : normValue(f, raw);
        if (f.k === 'images' && v && !v.length) v = null;
        if (v == null && !S.showEmpty) return;
        blocks.push({ id: f.id, label: tr(f.l), k: KIND[f.k], v });
      });
    }
    if (blocks.length) secs.push({ id: sec.id, title: tr(sec.t), blocks });
  });
  secs.forEach((s, i) => { s.no = i + 1; s.blocks.forEach((b, j) => { b.no = `${s.no}.${j + 1}`; }); });
  return { ar, lang: S.lang, dir: ar ? 'rtl' : 'ltr', meta, secs };
}

/* ── rich text (paragraphs, bullets, **bold**, [placeholders]) ─────── */
function parseRich(s) {
  const out = [];
  let para = [];
  let list = [];
  let ord = false;
  const fP = () => { if (para.length) { out.push({ t: 'p', s: para.join('\n') }); para = []; } };
  const fL = () => { if (list.length) { out.push({ t: ord ? 'ol' : 'ul', items: list }); list = []; } };
  String(s).replace(/\r/g, '').split('\n').forEach((raw) => {
    const line = raw.trim();
    const mb = line.match(/^[-•*]\s+(.*)$/);
    const mo = line.match(/^\d+[.)]\s+(.*)$/);
    if (mb || mo) {
      fP();
      const isOrd = !!mo;
      if (list.length && isOrd !== ord) fL();
      ord = isOrd;
      list.push((mb || mo)[1]);
    } else if (!line) { fP(); fL(); } else { fL(); para.push(line); }
  });
  fP(); fL();
  return out;
}

const inlineHTML = (s) => esc(s)
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
  .replace(/\[([^\]\n]{2,})\]/g, '<mark class="gdd-ph">[$1]</mark>');

function richHTML(s) {
  return parseRich(s).map((b) => {
    if (b.t === 'p') return `<p dir="${dirFor(b.s)}">${b.s.split('\n').map(inlineHTML).join('<br>')}</p>`;
    return `<${b.t}>${b.items.map((i) => `<li dir="${dirFor(i)}">${inlineHTML(i)}</li>`).join('')}</${b.t}>`;
  }).join('');
}

function tableHTML(t) {
  const tot = t.widths.reduce((a, b) => a + b, 0);
  const cols = t.widths.map((w) => `<col style="width:${(100 * w / tot).toFixed(1)}%">`).join('');
  return `<div class="gdd-tw"><table class="gdd-t"><colgroup>${cols}</colgroup><thead><tr>${t.head.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map((r) => `<tr>${r.map((x) => `<td dir="${dirFor(x)}">${inlineHTML(x).replace(/\n/g, '<br>')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

function galleryHTML(items, opt) {
  return `<div class="gdd-gal">${items.map((it) => {
    const e = IMG[it.id];
    const src = opt && opt.embed ? (e.dataUrl || '') : e.url;
    return `<figure class="gdd-fig${it.full ? ' full' : ''}"><img src="${src}" alt="${esc(it.cap)}" width="${it.w}" height="${it.h}">${it.cap ? `<figcaption dir="${dirFor(it.cap)}">${esc(it.cap)}</figcaption>` : ''}</figure>`;
  }).join('')}</div>`;
}

function blockHTML(b, opt) {
  const head = `<h3 class="gdd-h3"><span class="gdd-no">${b.no}</span><span>${esc(b.label)}</span></h3>`;
  let body = '';
  if (b.v == null) body = `<p class="gdd-tbd">${esc(tr(STR.tbd))}</p>`;
  else if (b.k === 'p') body = `<p dir="${dirFor(b.v)}">${inlineHTML(b.v)}</p>`;
  else if (b.k === 'rich') body = richHTML(b.v);
  else if (b.k === 'chips') body = `<p class="gdd-chips">${b.v.map((x) => `<span class="gdd-chip">${esc(x)}</span>`).join('')}</p>`;
  else if (b.k === 'ul') body = `<ul>${b.v.map((x) => `<li dir="${dirFor(x)}">${inlineHTML(x)}</li>`).join('')}</ul>`;
  else if (b.k === 'table') body = tableHTML(b.v);
  else if (b.k === 'images') body = galleryHTML(b.v, opt);
  else if (b.k === 'colors') body = `<div class="gdd-pal">${b.v.map((c) => `<div class="gdd-sw"><i style="background:${safeHex(c.c)}"></i><b dir="${dirFor(c.n)}">${esc(c.n)}</b><code dir="ltr">${safeHex(c.c).toUpperCase()}</code></div>`).join('')}</div>`;
  else if (b.k === 'kv') body = `<table class="gdd-kv"><tbody>${b.v.map((r) => `<tr><th>${esc(r[0])}</th><td dir="${dirFor(r[1])}">${esc(r[1])}</td></tr>`).join('')}</tbody></table>`;
  return `<div class="gdd-f">${b.k === 'kv' ? '' : head}${body}</div>`;
}

function docHTML(doc, opt = {}) {
  const m = doc.meta;
  const metaRows = [[tr(STR.docVersion), m.version], [tr(STR.docDate), m.date], [tr(STR.docAuthor), m.author], [tr(STR.docStudio), m.studio], [tr(STR.docStatus), m.status]].filter((r) => r[1]);
  let h = `<header class="gdd-cover"><p class="gdd-kicker">${esc(tr(STR.docType))}</p><h1 class="gdd-title" dir="${dirFor(m.title)}">${esc(m.title)}</h1>${m.tagline ? `<p class="gdd-tag" dir="${dirFor(m.tagline)}">${esc(m.tagline)}</p>` : ''}<table class="gdd-meta"><tbody>${metaRows.map((r) => `<tr><th>${esc(r[0])}</th><td dir="${dirFor(r[1])}">${esc(r[1])}</td></tr>`).join('')}</tbody></table></header>`;
  if (!doc.secs.length) return h + `<p class="gdd-tbd">${esc(tr(STR.emptyPreview))}</p>`;
  h += `<nav class="gdd-toc"><h2>${esc(tr(STR.contents))}</h2><ol>${doc.secs.map((s) => `<li><a href="#s-${s.id}" data-jump="s-${s.id}"><span>${s.no}</span>${esc(s.title)}</a></li>`).join('')}</ol></nav>`;
  doc.secs.forEach((s) => {
    h += `<section class="gdd-s" id="s-${s.id}"><h2 class="gdd-h2"><span class="gdd-no">${String(s.no).padStart(2, '0')}</span><span>${esc(s.title)}</span></h2>${s.blocks.map((b) => blockHTML(b, opt)).join('')}</section>`;
  });
  return h + `<footer class="gdd-foot">${esc(tr(STR.footerGen))}</footer>`;
}

  return `<!DOCTYPE html>\n<html lang="${doc.lang}" dir="${doc.dir}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(doc.meta.title)} - GDD</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="${FONT_URL}"><style>${DOC_CSS}${css}</style></head><body><div class="noprint"><button onclick="window.print()">${esc(tr(STR.printBtn))}</button></div><main class="gdd-page"><article class="gdd" lang="${doc.lang}" dir="${doc.dir}">${docHTML(doc, { embed: true })}</article></main></body></html>`;
}

/* ── Markdown ──────────────────────────────────────────────────────── */
function imageList(doc) {
  const out = [];
  let n = 0;
  doc.secs.forEach((s) => s.blocks.forEach((b) => {
    if (b.k === 'images' && b.v) b.v.forEach((it) => { out.push({ id: it.id, path: `images/fig-${++n}.${extOf(IMG[it.id].type)}`, cap: it.cap }); });
  }));
  return out;
}

function docMD(doc) {
  const paths = {};
  imageList(doc).forEach((x) => { paths[x.id] = x.path; });
  const m = doc.meta;
  const cell = (x) => String(x == null ? '' : x).replace(/\|/g, '\\|').replace(/\n/g, '<br>');
  const o = [`# ${m.title}`];
  if (m.tagline) o.push(`> ${m.tagline}`);
  const keys = [[tr(STR.docVersion), m.version], [tr(STR.docDate), m.date], [tr(STR.docAuthor), m.author], [tr(STR.docStudio), m.studio], [tr(STR.docStatus), m.status]].filter((r) => r[1]);
  o.push(`| ${keys.map((r) => cell(r[0])).join(' | ')} |\n|${keys.map(() => '---').join('|')}|\n| ${keys.map((r) => cell(r[1])).join(' | ')} |`);
  o.push(`## ${tr(STR.contents)}\n\n${doc.secs.map((s) => `${s.no}. ${s.title}`).join('\n')}`);
  doc.secs.forEach((s) => {
    o.push(`## ${s.no}. ${s.title}`);
    s.blocks.forEach((b) => {
      if (b.k !== 'kv') o.push(`### ${b.no} ${b.label}`);
      if (b.v == null) o.push(`_${tr(STR.tbd)}_`);
      else if (b.k === 'p' || b.k === 'rich') o.push(b.v);
      else if (b.k === 'chips') o.push(b.v.join(doc.ar ? '، ' : ', '));
      else if (b.k === 'ul') o.push(b.v.map((x) => `- ${x}`).join('\n'));
      else if (b.k === 'kv') o.push(b.v.map((r) => `- **${r[0]}:** ${r[1]}`).join('\n'));
      else if (b.k === 'colors') o.push(b.v.map((c) => `- **${c.n || c.c}**: \`${c.c.toUpperCase()}\``).join('\n'));
      else if (b.k === 'images') o.push(b.v.map((it) => `![${(it.cap || '').replace(/[\[\]]/g, '')}](${paths[it.id]})${it.cap ? `\n\n*${it.cap}*` : ''}`).join('\n\n'));
      else if (b.k === 'table') o.push(`| ${b.v.head.map(cell).join(' | ')} |\n|${b.v.head.map(() => '---').join('|')}|\n${b.v.rows.map((r) => `| ${r.map(cell).join(' | ')} |`).join('\n')}`);
    });
  });
  o.push(`---\n_${tr(STR.footerGen)}_`);
  return o.join('\n\n') + '\n';
}

/* ── Word (.docx) written by hand: a small ZIP (stored) + WordprocessingML ─ */
const CRC_T = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

function zipBlob(files, mime) {
  const enc = new TextEncoder();
  const now = new Date();
  const time = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const date = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  const parts = [];
  const central = [];
  let offset = 0;
  files.forEach((f) => {
    const name = enc.encode(f.name);
    const crc = crc32(f.data);
    const size = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true); ch.setUint32(20, size, true); ch.setUint32(24, size, true);
    ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + size;
  });
  let cdSize = 0;
  central.forEach((c) => { cdSize += c.length; });
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: mime });
}

const W_NS = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
const W_NS_DOC = `${W_NS} xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"`;
const XML_HEAD = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
const xe = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');

function segs(text) {
  const out = [];
  const re = /\*\*(.+?)\*\*|\[([^\]\n]{2,})\]/g;
  let last = 0;
  let m;
  while ((m = re.exec(text))) {
    if (m.index > last) out.push({ t: text.slice(last, m.index) });
    if (m[1] !== undefined) out.push({ t: m[1], b: true }); else out.push({ t: m[0], ph: true });
    last = m.index + m[0].length;
  }
  if (last < text.length) out.push({ t: text.slice(last) });
  return out;
}

function makeDocx(doc) {
  const rtlDoc = doc.dir === 'rtl';
  const run = (t, o = {}) => {
    if (!t) return '';
    const p = [];
    if (o.b) p.push('<w:b/><w:bCs/>');
    if (o.i) p.push('<w:i/><w:iCs/>');
    if (o.color) p.push(`<w:color w:val="${o.color}"/>`);
    if (o.sz) p.push(`<w:sz w:val="${o.sz}"/><w:szCs w:val="${o.sz}"/>`);
    if (o.hl) p.push(`<w:highlight w:val="${o.hl}"/>`);
    if (hasArabic(t)) p.push('<w:rtl/>');
    return `<w:r>${p.length ? `<w:rPr>${p.join('')}</w:rPr>` : ''}<w:t xml:space="preserve">${xe(t)}</w:t></w:r>`;
  };
  const para = (text, o = {}) => {
    const fs = textDir(text);
    const bidi = o.bidi !== undefined ? o.bidi : (fs ? fs === 'rtl' : rtlDoc);
    let runs = '';
    String(text).split('\n').forEach((ln, i) => {
      if (i) runs += '<w:r><w:br/></w:r>';
      segs(ln).forEach((s) => { runs += run(s.t, Object.assign({}, o.run, s.b ? { b: true } : {}, s.ph ? { hl: 'yellow' } : {})); });
    });
    const pp = [];
    if (o.style) pp.push(`<w:pStyle w:val="${o.style}"/>`);
    if (o.keep) pp.push('<w:keepNext/>');
    if (o.pb) pp.push('<w:pageBreakBefore/>');
    if (o.bullet) pp.push('<w:numPr><w:ilvl w:val="0"/><w:numId w:val="1"/></w:numPr>');
    if (bidi) pp.push('<w:bidi/>');
    if (o.sp) pp.push(`<w:spacing w:before="${o.sp[0]}" w:after="${o.sp[1]}"/>`);
    if (o.jc) pp.push(`<w:jc w:val="${o.jc}"/>`);
    return `<w:p>${pp.length ? `<w:pPr>${pp.join('')}</w:pPr>` : ''}${runs}</w:p>`;
  };
  const rich = (s) => parseRich(s).map((b) => {
    if (b.t === 'p') return para(b.s);
    if (b.t === 'ul') return b.items.map((i) => para(i, { bullet: true, sp: [0, 60] })).join('');
    return b.items.map((i, n) => para(`${n + 1}. ${i}`, { sp: [0, 60] })).join('');
  }).join('');
  const BORD = ['top', 'left', 'bottom', 'right', 'insideH', 'insideV'].map((k) => `<w:${k} w:val="single" w:sz="4" w:space="0" w:color="D3DCE8"/>`).join('');
  const TOTAL = 9638;
  const table = (head, rows, widths, o = {}) => {
    const tot = widths.reduce((a, b) => a + b, 0);
    const w = widths.map((x) => Math.round(TOTAL * x / tot));
    const cellParas = (txt, hdr) => String(txt || '').split('\n').map((ln) => para(ln.replace(/^\s*[-•*]\s+/, '• '), { sp: [30, 30], run: hdr ? { b: true, color: 'FFFFFF', sz: 20 } : { sz: 20 } })).join('') || para('', { sp: [30, 30] });
    const tc = (txt, i, hdr, fill) => `<w:tc><w:tcPr><w:tcW w:w="${w[i]}" w:type="dxa"/>${fill ? `<w:shd w:val="clear" w:color="auto" w:fill="${fill}"/>` : ''}</w:tcPr>${cellParas(txt, hdr)}</w:tc>`;
    let x = `<w:tbl><w:tblPr>${rtlDoc ? '<w:bidiVisual/>' : ''}<w:tblW w:w="${TOTAL}" w:type="dxa"/><w:tblBorders>${BORD}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:top w:w="40" w:type="dxa"/><w:left w:w="100" w:type="dxa"/><w:bottom w:w="40" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${w.map((v) => `<w:gridCol w:w="${v}"/>`).join('')}</w:tblGrid>`;
    if (head) x += `<w:tr><w:trPr><w:cantSplit/><w:tblHeader/></w:trPr>${head.map((h, i) => tc(h, i, true, '12315F')).join('')}</w:tr>`;
    rows.forEach((r, n) => {
      x += `<w:tr><w:trPr><w:cantSplit/></w:trPr>${r.map((c, i) => {
        if (o.swatch && i === 0) return tc(' ', i, false, safeHex(c.c || c).slice(1).toUpperCase());
        return tc(c, i, false, o.kv && i === 0 ? 'EEF3FA' : (n % 2 && !o.kv ? 'F5F8FC' : ''));
      }).join('')}</w:tr>`;
    });
    return x + '</w:tbl>' + para('', { sp: [0, 60] });
  };

  const media = [];
  const drawing = (it, maxW, maxH) => {
    const e = IMG[it.id];
    if (!e || !e.bytes) return '';
    let cx = Math.min(maxW, e.w * 9525);
    let cy = Math.round(cx * e.h / e.w);
    if (cy > maxH) { cy = maxH; cx = Math.round(cy * e.w / e.h); }
    cx = Math.round(cx);
    const n = media.length + 1;
    const name = `image${n}.${extOf(e.type)}`;
    media.push({ name: `word/media/${name}`, data: e.bytes, rid: `rIdImg${n}`, target: `media/${name}` });
    return `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${n}" name="Picture ${n}" descr="${xe(it.cap)}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic><pic:nvPicPr><pic:cNvPr id="${n}" name="${name}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="rIdImg${n}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;
  };
  const figure = (it, maxW, maxH) => {
    const dr = drawing(it, maxW, maxH);
    if (!dr) return '';
    return `<w:p><w:pPr><w:keepNext/>${rtlDoc ? '<w:bidi/>' : ''}<w:spacing w:before="80" w:after="40"/><w:jc w:val="center"/></w:pPr>${dr}</w:p>${it.cap ? para(it.cap, { run: { i: true, color: '58687B', sz: 19 }, sp: [0, 140], jc: 'center' }) : ''}`;
  };
  const gallery = (items) => {
    let out = '';
    let pend = [];
    const cell = (it) => `<w:tc><w:tcPr><w:tcW w:w="4819" w:type="dxa"/></w:tcPr>${(it && figure(it, 2850000, 4200000)) || '<w:p/>'}</w:tc>`;
    const flush = () => {
      if (!pend.length) return;
      out += `<w:tbl><w:tblPr>${rtlDoc ? '<w:bidiVisual/>' : ''}<w:tblW w:w="${TOTAL}" w:type="dxa"/><w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid><w:gridCol w:w="4819"/><w:gridCol w:w="4819"/></w:tblGrid><w:tr><w:trPr><w:cantSplit/></w:trPr>${cell(pend[0])}${cell(pend[1])}</w:tr></w:tbl>${para('', { sp: [0, 60] })}`;
      pend = [];
    };
    items.forEach((it) => {
      if (it.full) { flush(); out += figure(it, 6000000, 6800000); } else { pend.push(it); if (pend.length === 2) flush(); }
    });
    flush();
    return out;
  };

  const m = doc.meta;
  let body = para(tr(STR.docType), { run: { color: 'C2410C', b: true, sz: 20 } });
  body += para(m.title, { style: 'Title' });
  if (m.tagline) body += para(m.tagline, { style: 'Subtitle' });
  const keys = [[tr(STR.docVersion), m.version], [tr(STR.docDate), m.date], [tr(STR.docAuthor), m.author], [tr(STR.docStudio), m.studio], [tr(STR.docStatus), m.status]].filter((r) => r[1]);
  body += table(null, keys, [1, 3], { kv: true });
  body += para(tr(STR.contents), { style: 'ContentsTitle', pb: true });
  doc.secs.forEach((s) => { body += para(`${s.no}   ${s.title}`, { sp: [40, 40] }); });
  doc.secs.forEach((s, si) => {
    body += para(`${s.no}   ${s.title}`, { style: 'Heading1', pb: si === 0 });
    s.blocks.forEach((b) => {
      if (b.k !== 'kv') body += para(`${b.no}   ${b.label}`, { style: 'Heading2' });
      if (b.v == null) body += para(tr(STR.tbd), { run: { i: true, color: '7B8898' } });
      else if (b.k === 'p') body += para(b.v);
      else if (b.k === 'rich') body += rich(b.v);
      else if (b.k === 'chips') body += para(b.v.join('  ·  '));
      else if (b.k === 'ul') body += b.v.map((x) => para(x, { bullet: true, sp: [0, 60] })).join('');
      else if (b.k === 'kv') body += table(null, b.v, [1, 3], { kv: true });
      else if (b.k === 'table') body += table(b.v.head, b.v.rows, b.v.widths);
      else if (b.k === 'colors') body += table(null, b.v.map((c) => [c, c.n, c.c.toUpperCase()]), [1, 3, 2], { swatch: true });
      else if (b.k === 'images') body += gallery(b.v);
    });

/* ── IndexedDB ── */
function idbOpen() {
  return new Promise((resolve) => {
    try {
      if (typeof indexedDB === 'undefined' || !indexedDB) { resolve(false); return; }
      const rq = indexedDB.open('gdd-assistant', 1);
      rq.onupgradeneeded = () => { rq.result.createObjectStore('imgs', { keyPath: 'id' }); };
      rq.onsuccess = () => { IDBS.db = rq.result; IDBS.ok = true; resolve(true); };
      rq.onerror = () => resolve(false);
      rq.onblocked = () => resolve(false);
      setTimeout(() => resolve(false), 4000);
    } catch (e) { resolve(false); }
  });
}
function idbTx(mode, fn) {
  return new Promise((resolve, reject) => {
    if (!IDBS.ok) { reject(new Error('idb')); return; }
    try {
      const tx = IDBS.db.transaction('imgs', mode);
      let out;
      const rq = fn(tx.objectStore('imgs'));
      if (rq) rq.onsuccess = () => { out = rq.result; };
      tx.oncomplete = () => resolve(out);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    } catch (e) { reject(e); }
  });
}
const idbPut = (rec) => idbTx('readwrite', (s) => s.put(rec));
const idbGet = (id) => idbTx('readonly', (s) => s.get(id));

/* ── compression: max 1600 px, re-encoded so EXIF rotation is baked in ── */
async function shrinkImage(file) {
  if (!isImgFile(file)) throw new Error('type');
  if (file.size > 40 * 1024 * 1024) throw new Error('size');
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    const w0 = img.naturalWidth;
    const h0 = img.naturalHeight;
    if (!w0 || !h0) throw new Error('decode');
    const k = Math.min(1, IMG_MAX_SIDE / Math.max(w0, h0));
    const w = Math.max(1, Math.round(w0 * k));
    const h = Math.max(1, Math.round(h0 * k));
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const g = cv.getContext('2d');
    const enc = (type, q) => new Promise((res) => cv.toBlob(res, type, q));
    let blob = null;
    if (file.type === 'image/png') {
      g.drawImage(img, 0, 0, w, h);
      blob = await enc('image/png');
      if (blob && blob.size > 1.4 * 1024 * 1024) blob = null;
    }
    if (!blob) {
      g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
      g.drawImage(img, 0, 0, w, h);
      blob = await enc('image/jpeg', 0.84);
    }
    if (!blob) throw new Error('encode');
    return { type: blob.type, buf: await blob.arrayBuffer(), w, h };
  } finally { URL.revokeObjectURL(url); }
}

function defaults() {
  return { version: '0.1', date: today(), status: 'draft', engine: 'unity', persp: '2d-side', audience: 'all', model: 'tbd', teamSize: 'solo', scope: 'indie', genres: [], platforms: [], players: ['single'], langs: ['ar', 'en'] };
}
function blank() { return { v: 1, t: 0, lang: 'ar', step: 0, tab: 'edit', sample: false, auto: {}, d: defaults(), showEmpty: false }; }

function sanitize(d) {
  const out = {};
  SECTIONS.forEach((sec) => sec.f.forEach((f) => {
    let v = d ? d[f.id] : undefined;
    if (['multi', 'list', 'table', 'colors', 'images'].includes(f.k)) {
      if (!Array.isArray(v)) v = undefined;
      else if (f.k === 'multi') v = v.filter((x) => typeof x === 'string');
      else if (f.k === 'list') v = v.map((x) => String(x == null ? '' : x));
      else if (f.k === 'table') v = v.filter(Array.isArray).map((r) => f.cols.map((c, i) => String(r[i] == null ? '' : r[i])));
      else if (f.k === 'colors') v = v.filter((x) => Array.isArray(x) && HEX.test(x[0])).map((x) => [x[0], String(x[1] || '')]);
      else v = v.filter((x) => x && typeof x === 'object' && IMG_ID.test(String(x.id))).slice(0, IMG_PER_FIELD).map((x) => ({ id: String(x.id), cap: String(x.cap || '').slice(0, 300), w: +x.w || 0, h: +x.h || 0, full: !!x.full }));
    } else if (v == null) v = undefined;
    else v = String(v);
    if (v !== undefined) out[f.id] = v;
  }));
  return out;
}
function normalizeState(o) {
  const b = blank();
  const s = Object.assign(b, { t: +o.t || 0, lang: o.lang === 'en' ? 'en' : 'ar', sample: !!o.sample, showEmpty: !!o.showEmpty });
  s.d = Object.assign(defaults(), sanitize(o.d));
  s.auto = {};
  Object.keys(o.auto || {}).forEach((k) => { if (FIELD[k] && o.auto[k]) s.auto[k] = true; });
  return s;
}
function exportState() { return { v: 1, t: S.t, lang: S.lang, sample: S.sample, auto: S.auto, d: S.d, showEmpty: S.showEmpty }; }

function sampleState() {
  const s = blank();
  s.sample = true;
  Object.assign(s.d, SAMPLE_SETUP);
  S = s;
  genAll(true);
  s.t = 0;
  return s;
}
function loadLocal() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const o = JSON.parse(raw); if (o && o.v === 1 && o.d) return normalizeState(o); }
  } catch (e) { /* storage unavailable */ }
  return null;
}
function loadUi() {
  try {
    const u = JSON.parse(localStorage.getItem(UIKEY) || 'null');
    if (u) { S.step = Math.min(Math.max(+u.step || 0, 0), SECTIONS.length - 1); S.tab = ['edit', 'preview', 'review', 'export'].includes(u.tab) ? u.tab : 'edit'; }
  } catch (e) { /* ignore */ }
}
function saveUi() { try { localStorage.setItem(UIKEY, JSON.stringify({ step: S.step, tab: S.tab })); } catch (e) { /* ignore */ } }

/* ── persistence: local copy + optional per-user cloud copy ─────────── */
const CLOUD = { ref: null, ready: false, busy: false, dirty: false };
let saveTimer = 0;
let localOk = true;

function writeLocal() {
  try { localStorage.setItem(KEY, JSON.stringify(exportState())); localOk = true; } catch (e) { localOk = false; }
}
function touch() {
  S.t = Date.now();
  setSave('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 700);
}
function flushSave() {
  clearTimeout(saveTimer);
  writeLocal();
  if (CLOUD.ref && CLOUD.ready) pushCloud();
  else setSave(localOk ? 'local' : 'err');
}
async function pushCloud() {
  if (CLOUD.busy) { CLOUD.dirty = true; return; }
  CLOUD.busy = true;
  CLOUD.dirty = false;
  try {
    await CLOUD.ref.set({ v: 1, t: S.t, json: JSON.stringify(exportState()) });
    setSave('cloud');
  } catch (e) { setSave(localOk ? 'local' : 'err'); } finally {
    CLOUD.busy = false;
    if (CLOUD.dirty) pushCloud();
  }
}
function setSave(st) { saveState = st; paintSave(); }
function paintSave() {
  const el = $('#save');
  if (!el) return;
  const m = { saving: [T('saving'), T('saving')], local: [T('saveShort'), T('savedLocal')], cloud: [T('saveShort'), T('savedCloud')], err: [T('saveFail'), T('saveErr')], ok: [T('saveShort'), T('savedLocal')] }[saveState] || [T('saveShort'), ''];
  el.className = 'save ' + saveState;
  el.title = m[1];
  el.innerHTML = `<i></i><span>${esc(m[0])}</span>`;
}

/* ── generation ─────────────────────────────────────────────────────── */
function genField(f, force) {
  if (!canGen(f)) return false;
  const cur = S.d[f.id];
  if (!(force || isEmpty(f, cur) || S.auto[f.id])) return false;
  const v = genValue(f);
  if (v == null) return false;
  S.d[f.id] = v;
  S.auto[f.id] = true;
  return true;
}
function genAll(force) {
  let n = 0;
  SECTIONS.forEach((sec) => sec.f.forEach((f) => { if (genField(f, force)) n++; }));
  return n;
}
function refreshAuto() {
  SECTIONS.forEach((sec) => sec.f.forEach((f) => {
    if (S.auto[f.id] && canGen(f)) { const v = genValue(f); if (v != null) S.d[f.id] = v; }
  }));
}
let rfTimer = 0;
function scheduleRefresh() {
  clearTimeout(rfTimer);
  rfTimer = setTimeout(() => {
    refreshAuto();
    if (S.tab === 'edit') SECTIONS[S.step].f.forEach((f) => { if (S.auto[f.id]) refreshField(f.id); });
    scheduleProgress();
  }, 250);
}
function userEdited() {
  return SECTIONS.some((sec) => sec.f.some((f) => !f.meta && canGen(f) && !isEmpty(f, S.d[f.id]) && !S.auto[f.id]));
}

/* ── progress + review ──────────────────────────────────────────────── */
function calc() {
  const secs = SECTIONS.map((sec) => {
    const fs = sec.f.filter((f) => f.k !== 'images');
    let n = 0;
    fs.forEach((f) => { if (!isEmpty(f, S.d[f.id])) n++; });
    return { id: sec.id, n, t: fs.length, pct: Math.round(100 * n / fs.length) };
  });
  const n = secs.reduce((a, b) => a + b.n, 0);
  const t = secs.reduce((a, b) => a + b.t, 0);
  return { secs, n, t, pct: Math.round(100 * n / t) };
}
const nz = (id) => !isEmpty(FIELD[id], S.d[id]);
const cnt = (id) => (S.d[id] || []).filter((x) => (Array.isArray(x) ? x.some((y) => String(y).trim()) : String(x).trim())).length;
const wordsOf = (id) => String(S.d[id] || '').trim().split(/\s+/).filter(Boolean).length;
function phFields() {
  const re = /\[[^\]\n]{2,}\]/;
  const out = [];
  SECTIONS.forEach((sec) => sec.f.forEach((f) => {
    if (f.meta) return;
    const v = S.d[f.id];
    if (isEmpty(f, v)) return;
    let txt = '';
    if (f.k === 'area' || f.k === 'text') txt = v;
    else if (f.k === 'list') txt = v.join('\n');
    else if (f.k === 'table') txt = v.map((r) => r.join('\n')).join('\n');
    if (re.test(txt)) out.push(f.id);
  }));
  return out;
}
const RULES = [

  { s: 'tech', f: 'arch', ok: () => nz('arch'), m: ['صف بنية الكود.', 'Describe the code architecture.'] },

function issues() {

function controlHTML(f, v, busy) {

/* ── toasts + dialogs ───────────────────────────────────────────────── */
function toast(msg, action) {
  const root = $('#toastRoot');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button" class="tbtn">${esc(action.label)}</button>` : ''}`;
  if (action) el.querySelector('button').onclick = () => { action.cb(); el.remove(); };
  root.appendChild(el);
  while (root.children.length > 3) root.firstChild.remove();
  setTimeout(() => el.remove(), action ? 10000 : 3800);
}

function dlg({ title, body = '', buttons }) {
  return new Promise((resolve) => {
    const root = $('#modalRoot');
    root.innerHTML = `<div class="modal-bg" data-bg="1"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="dlgT"><h2 id="dlgT">${esc(title)}</h2><div class="modal-body">${body}</div><div class="modal-btns">${buttons.map((b, i) => `<button type="button" class="btn ${b.kind || ''}" data-dlg="${i}">${esc(b.label)}</button>`).join('')}</div></div></div>`;
    const close = (v) => { document.removeEventListener('keydown', onKey); root.innerHTML = ''; resolve(v); };
    const onKey = (e) => { if (e.key === 'Escape') close(null); };
    document.addEventListener('keydown', onKey);
    root.firstChild.addEventListener('click', (e) => {
      const b = e.target.closest('[data-dlg]');
      if (b) close(buttons[+b.dataset.dlg].id);
      else if (e.target.dataset.bg) close(null);
    });
    const first = root.querySelector('.btn.primary') || root.querySelector('.btn');
    if (first) first.focus();
  });
}
const yesNo = (title, text) => dlg({ title, body: `<p>${esc(text)}</p>`, buttons: [{ id: 'no', label: T('btnCancel') }, { id: 'yes', label: T('btnContinue'), kind: 'primary' }] }).then((r) => r === 'yes');

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast(T('copied')); return true; } catch (e) { /* fall through */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;inset-block-start:0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    if (ok) { toast(T('copied')); return true; }
  } catch (e) { /* fall through */ }
  toast(T('copyFail'));
  return false;
}
function viewText(text) {
  dlg({ title: T('textTitle'), body: `<textarea class="inp area mono" readonly rows="12" dir="auto">${esc(text)}</textarea>`, buttons: [{ id: 'c', label: T('btnClose'), kind: 'primary' }] });

function doUndo() {
